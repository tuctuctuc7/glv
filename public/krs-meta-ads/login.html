<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KURSA Meta Ads · Access</title>
<link rel="icon" type="image/svg+xml" href="/krs-meta-ads/agenthic-logo.svg">
<style>
:root{color-scheme:dark;--bg:#091019;--surface:#111a26;--surface2:#162231;--line:#28374a;--ink:#f7f9fc;--muted:#9aacc1;--blue:#5bb7f2;--red:#ff817d;--green:#90dfa8}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 0,rgba(91,183,242,.15),transparent 34%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.access{width:min(100%,410px);padding:28px;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 90%,var(--blue)));border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.32)}.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-row img{width:42px;height:42px}.eyebrow{color:var(--blue);font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.brand{font-size:20px;font-weight:850;letter-spacing:-.035em;margin-top:3px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:20px}label{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}input,button{width:100%;height:46px;border-radius:10px;font:inherit}input{padding:0 13px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:15px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,183,242,.17)}button{margin-top:12px;border:0;background:var(--blue);color:#071019;font-size:14px;font-weight:850;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:20px;margin-top:12px;color:var(--red);font-size:13px}.msg.ok{color:var(--green)}
</style>
</head>
<body>
<main class="access">
  <div class="brand-row"><img src="/krs-meta-ads/agenthic-logo.svg" alt=""><div><div class="eyebrow">Private client dashboard</div><div class="brand">KURSA Meta Ads</div></div></div>
  <p class="sub">Performance and funnel intelligence for the KURSIVA s.r.o. Meta account.</p>
  <form id="access-form">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button id="submit-btn" type="submit">Enter dashboard</button>
    <div class="msg" id="message" role="status"></div>
  </form>
</main>
<script>
const form=document.getElementById('access-form');const input=document.getElementById('password');const button=document.getElementById('submit-btn');const message=document.getElementById('message');
function nextPath(){const next=new URLSearchParams(location.search).get('next')||'/krs-meta-ads/';return next.startsWith('/krs-meta-ads')?next:'/krs-meta-ads/';}
form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';message.classList.remove('ok');button.disabled=true;try{const response=await fetch('/api/krs-meta-ads/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});if(!response.ok){message.textContent='That password did not work.';button.disabled=false;input.select();return;}message.textContent='Access granted.';message.classList.add('ok');location.assign(nextPath());}catch{message.textContent='Could not check the password. Try again.';button.disabled=false;}});
</script>
</body>
</html>
